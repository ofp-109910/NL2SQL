name: offline-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: nl2sql doctor
      - run: nl2sql minimal --offline
      - run: nl2sql init --evaluation
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m build --no-isolation
      - name: Smoke-test installed wheel from outside source checkout
        shell: bash
        run: |
          python -m pip uninstall -y nl2sql-handbook
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          nl2sql minimal --offline
          nl2sql rag --retrieve-only -q '销售额怎么算'
